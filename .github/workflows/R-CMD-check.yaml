# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    container:
      image: daratools/robase:latest
    env:
      # AT_ROvis authenticates installs of private rivm-syso/ROvis.* dependencies
      # (via the Remotes: field in DESCRIPTION). Falls back to the default
      # GITHUB_TOKEN for packages with no private cross-repo dependencies.
      GITHUB_PAT: ${{ secrets.AT_ROvis || secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      # rocker-based images run as root; mark the workspace as safe for git,
      # otherwise git operations fail with "dubious ownership"
      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # R and pandoc are already baked into daratools/robase - no setup-r/setup-pandoc needed.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
