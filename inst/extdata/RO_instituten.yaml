        - hemelblauw
        - donkergeel
        - robijnrood
        - paars_tint90
        - mintgroen_tint110
        - oranje
        - groen
        - donkerbruin
      gender_con:
        - hemelblauw
        - robijnrood
        - paars_tint90
      gender_uncon:
