# This yaml file contains all settings (colors for now) for generating a figure with institute dependent settings.

# How to use:
# Use `define_setter_function_here` to set a specific institute. This function will automatically check the
# list of specified institutes.
# Institute not listed? Add your institute by adding your settings to this file trough a pull request, or use
# a local config file instead.


# TODO: not sure if palletes should be its own branch or under colors.

RIVM:
  colors:
    base_colors:
      lintblauw: "#154273"
      paars: "#42145f"
      paars_tint90: "#552c6f"
      violet: "#a90061"
      robijnrood: "#ca005d"
      roze: "#f092cd"
      roze_tint110: "#d883b9"
      rood: "#d52b1e"
      oranje: "#e17000"
      donkergeel: "#ffb612"
      geel: "#f9e11e"
      donkerbruin: "#673327"
      bruin: "#94710a"
      donkergroen: "#275937"
      groen: "#39870c"
      mosgroen: "#777b00"
      mintgroen: "#76d2b6"
      mintgroen_tint110: "#6abda4"
      donkerblauw: "#01689b"
      hemelblauw: "#007bc7"
      lichtblauw: "#8fcae7"
      lichtblauw_tint110: "#81b6d0"
