        - lintblauw
        - paars
        - paars_tint90
        - violet
        - robijnrood
        - roze
        - roze_tint110
        - rood
        - oranje
        - donkergeel
        - geel
        - donkerbruin
        - bruin
        - donkergroen
        - groen
        - mosgroen
        - mintgroen
        - mintgroen_tint110
        - donkerblauw
        - hemelblauw
        - lichtblauw
        - lichtblauw_tint110
